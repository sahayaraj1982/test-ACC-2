<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ரயில் முன்பதிவு விவரங்கள்</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            background: #2d2d44;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            width: 420px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00bcd4;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #b0bec5;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #1e1e2f;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .input-group {
            flex: 1;
        }
        .passenger-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .passenger-row input[type="text"] {
            flex: 2;
        }
        .passenger-row input[type="number"] {
            flex: 1;
        }
        .passenger-row select {
            flex: 1.2;
        }
        button.save-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button.save-btn:hover {
            background-color: #388E3C;
        }
        button.copy-btn {
            background-color: #ff9800;
            color: white;
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }
        button.copy-btn:hover {
            background-color: #e68900;
        }
        /* Index List Style */
        .index-list {
            margin-top: 15px;
            background: #3a3a5e;
            padding: 12px;
            border-radius: 6px;
        }
        .index-item {
            background: #2d2d44;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }
        .index-item:hover {
            background: #00bcd4;
            color: #000;
        }
        /* Modal Popup Style */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #2d2d44;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            color: #fff;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #ff5252;
        }
        .record-passenger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            margin-top: 10px;
            padding: 8px;
            background: #3a3a5e;
            border-radius: 4px;
        }
        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 10px;
            position: fixed;
            z-index: 20;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 1.5s;
        }
        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ரயில் முன்பதிவு படிவம்</h2>
        
        <!-- From and To Section -->
        <div class="row">
            <div class="input-group">
                <label for="fromInput">From:</label>
                <input type="text" id="fromInput" placeholder="எ.கா: MDU">
            </div>
            <div class="input-group">
                <label for="toInput">To:</label>
                <input type="text" id="toInput" placeholder="எ.கா: MS">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">

        <label style="margin-bottom: 10px; font-weight: bold; color: #00bcd4;">பயணிகள் விவரங்கள் (4 நபர்கள் வரை):</label>
        
        <!-- Passenger Inputs -->
        <div class="passenger-row"><input type="text" id="p1_name" placeholder="பெயர் 1"><input type="number" id="p1_age" placeholder="வயது"><select id="p1_gender"><option value="ஆண்">ஆண்</option><option value="பெண்">பெண்</option></select></div>
        <div class="passenger-row"><input type="text" id="p2_name" placeholder="பெயர் 2"><input type="number" id="p2_age" placeholder="வயது"><select id="p2_gender"><option value="ஆண்">ஆண்</option><option value="பெண்">பெண்</option></select></div>
        <div class="passenger-row"><input type="text" id="p3_name" placeholder="பெயர் 3"><input type="number" id="p3_age" placeholder="வயது"><select id="p3_gender"><option value="ஆண்">ஆண்</option><option value="பெண்">பெண்</option></select></div>
        <div class="passenger-row"><input type="text" id="p4_name" placeholder="பெயர் 4"><input type="number" id="p4_age" placeholder="வயது"><select id="p4_gender"><option value="ஆண்">ஆண்</option><option value="பெண்">பெண்</option></select></div>

        <button class="save-btn" onclick="saveRecord()">Save (சேமி)</button>

        <!-- Index List Section -->
        <div id="indexListSection" class="index-list" style="display: none;">
            <label style="margin-bottom: 8px; font-weight: bold; color: #00bcd4;">சேமிக்கப்பட்ட பதிவுகள் (Click to View):</label>
            <div id="indexContainer"></div>
        </div>
    </div>

    <!-- Modal Popup for Detailed View -->
    <div id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toast">Copied Success!</div>

    <script>
        let allRecords = [];

        function saveRecord() {
            const fromVal = document.getElementById('fromInput').value.trim();
            const toVal = document.getElementById('toInput').value.trim();

            if (fromVal === '' || toVal === '') {
                alert('தயவுசெய்து From மற்றும் To இடங்களை உள்ளிடவும்!');
                return;
            }

            let passengers = [];
            for (let i = 1; i <= 4; i++) {
                const name = document.getElementById(`p${i}_name`).value.trim();
                const age = document.getElementById(`p${i}_age`).value.trim();
                const gender = document.getElementById(`p${i}_gender`).value;

                if (name !== '' && age !== '') {
                    passengers.push({ name, age, gender });
                }
            }

            if (passengers.length === 0) {
                alert('குறைந்தது ஒரு பயணியின் பெயர் மற்றும் வயதை உள்ளிடவும்!');
                return;
            }

            // Save record to array
            allRecords.push({ from: fromVal, to: toVal, passengers: passengers });
            renderIndexList();

            // Clear inputs
            document.getElementById('fromInput').value = '';
            document.getElementById('toInput').value = '';
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`p${i}_name`).value = '';
                document.getElementById(`p${i}_age`).value = '';
                document.getElementById(`p${i}_gender`).value = 'ஆண்';
            }
            document.getElementById('fromInput').focus();
        }

        function renderIndexList() {
            const indexContainer = document.getElementById('indexContainer');
            indexContainer.innerHTML = '';
            document.getElementById('indexListSection').style.display = 'block';

            allRecords.forEach((record, index) => {
                const item = document.createElement('div');
                item.className = 'index-item';
                item.innerHTML = `<span>பதிவு ${index + 1} (${record.from} ➔ ${record.to})</span> <span>🔍 காண்க</span>`;
                item.onclick = function() {
                    openModal(index);
                };
                indexContainer.appendChild(item);
            });
        }

        function openModal(index) {
            const record = allRecords[index];
            let html = `
                <h3 style="color: #00bcd4; margin-top:0;">பதிவு ${index + 1} விவரங்கள்</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #3a3a5e; padding: 10px; border-radius: 6px;">
                    <span><strong>From:</strong> ${record.from} | <strong>To:</strong> ${record.to}</span>
                    <div>
                        <button class="copy-btn" onclick="copyText('${record.from}')">Copy From</button>
                        <button class="copy-btn" onclick="copyText('${record.to}')">Copy To</button>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
                <label style="font-weight:bold; color:#00bcd4; margin-bottom:10px; display:block;">பயணிகள்:</label>
            `;

            record.passengers.forEach(p => {
                html += `
                    <div class="record-passenger">
                        <span><strong>${p.name}</strong> (${p.age} / ${p.gender})</span>
                        <button class="copy-btn" onclick="copyText('${p.name}')">Copy Name</button>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 1500);
        }
    </script>
</body>
</html>
